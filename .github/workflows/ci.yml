name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: 单测 + 类型 + Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run check

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test

  mutation:
    name: 变异测试(阈值 break=65)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Run Stryker
        run: |
          npx stryker run 2>&1 | tee stryker-run.log
          exit ${PIPESTATUS[0]}
      - name: 失败时输出日志尾部到 summary
        if: failure()
        run: |
          {
            echo "### Stryker 输出尾部"
            echo '```'
            tail -c 4000 stryker-run.log 2>/dev/null || echo "(no log)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
